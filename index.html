<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Esteban Soraire</h1>
        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#servicios">Servicios</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>
    <section id="servicios">
        <h2>Servicios</h2>
        <div class="cards">
            <div class="card">
                <h3>Desarrollo Web</h3>
                <p>Creación de sitios modernos.</p>
            </div>
            <div class="card">
                <h3>Backend</h3>
                <p>APIs en .NET y SQL Server.</p>
            </div>
            <div class="card">
                <h3>Soporte</h3>
                <p>Mantenimiento y mejoras.</p>
            </div>
        </div>
    </section>
    <section id="contacto">
        <h2>Contacto</h2>
        <form onsubmit="enviarFormulario(event)">
            <input type="text" placeholder="Nombre" required>
            <input type="email" placeholder="Email" required>
            <textarea placeholder="Mensaje" required></textarea>
            <button type="submit">Enviar</button>
        </form>
    </section>
    <footer>
        <p>© 2026 - Mi Sitio</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
